<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif; color: #0f172a; }
  header { padding: 12px 14px; background: #0f172a; color: #fff; font-weight: 600; }
  section { padding: 12px 14px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 4px 0 8px; }
  button { padding: 6px 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button.quiet { background: #e2e8f0; color: #0f172a; }
  .job { border-top: 1px solid #e2e8f0; padding: 8px 0; display: flex; gap: 8px; align-items: center; }
  .job div { flex: 1; min-width: 0; }
  .job b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: #64748b; font-size: 12px; }
  .err { color: #b91c1c; }
  label.mode { display: block; margin: 2px 0; }
</style></head>
<body>
<header>Job Hunter · B0 test</header>
<section id="pair" hidden>
  <div>1. Signed in to Job Hunter as the admin, open <a id="codeLink" target="_blank">the pairing code page</a>.</div>
  <div style="margin-top:8px">2. Type the 6 digits here:</div>
  <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456">
  <details class="muted"><summary>Server</summary><input type="text" id="server"></details>
  <button id="pairBtn">Connect</button> <span id="pairMsg" class="err"></span>
</section>
<section id="main" hidden>
  <div><b>Who presses Submit?</b></div>
  <label class="mode"><input type="radio" name="mode" value="A"> Run A: I do (the extension fills)</label>
  <label class="mode"><input type="radio" name="mode" value="B"> Run B: the extension does, 5 s after filling</label>
  <div style="margin-top:10px"><label><input type="checkbox" id="all"> Show every system</label></div>
  <div id="jobs" style="margin-top:6px"></div>
  <div style="margin-top:12px;border-top:1px solid #e2e8f0;padding-top:10px">
    <div><b>Add a job</b> <span class="muted">(Comeet, Lever, SmartRecruiters)</span></div>
    <button id="addTab" hidden style="margin-top:6px"></button>
    <input type="text" id="link" placeholder="or paste the job's link">
    <button id="addLink" class="quiet">Add</button> <span id="addMsg" class="muted"></span>
  </div>
  <div class="muted" style="margin-top:10px">Results so far: <span id="tally"></span> · <a href="#" id="unpair">disconnect</a></div>
</section>
<script src="popup.js"></script>
</body></html>
